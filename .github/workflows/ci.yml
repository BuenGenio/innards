name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"] # tags are handled by release.yml
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  core:
    name: innards-core (cargo test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: core

      - name: cargo test -p innards-core
        run: cargo test -p innards-core --locked

  app:
    name: app (svelte-check, vite build, cargo build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Tauri's Linux build dependencies (WebKitGTK 4.1, tray, rsvg, patchelf, xdo).
      - name: Install Tauri apt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file libssl-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: pnpm check (svelte-check)
        run: pnpm check

      # Produces ./build, which tauri::generate_context! embeds at compile time,
      # so it must run before cargo build.
      - name: pnpm build
        run: pnpm build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: app
          workspaces: ". -> target"

      - name: cargo build -p innards
        run: cargo build -p innards --locked
