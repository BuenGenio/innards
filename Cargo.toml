[workspace]
resolver = "2"
members = ["crates/innards-core", "crates/innards-cli", "src-tauri", "tools/innards-license"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Eugene Trotsan"]
repository = "https://github.com/buengenio/innards"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
