<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="preload" href="%sveltekit.assets%/fonts/bricolage-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="%sveltekit.assets%/fonts/instrument-normal.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="theme-color" content="#f5f3ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141317" media="(prefers-color-scheme: dark)" />
    <script>
      // Native window chrome for the demo window: set <html data-os> before first paint.
      (function () {
        var os = null;
        try { os = localStorage.getItem('innards-os'); } catch (e) {}
        if (os !== 'mac' && os !== 'windows' && os !== 'linux') {
          var p = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || '';
          var u = navigator.userAgent || '';
          os = /win/i.test(p) || /Windows/i.test(u) ? 'windows'
            : /mac|iphone|ipad|ipod/i.test(p) || /Mac OS|iPhone|iPad/i.test(u) ? 'mac'
            : 'linux';
        }
        document.documentElement.dataset.os = os;
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
